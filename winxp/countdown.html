<!DOCTYPE html>
<style>
    #countdown.page {
        background-color: hsl(0, 0%, 16%);
        width: 100%;
        height: 100%;
    }

    #countdown.page p {
        color: mediumaquamarine;
        font-size: 2vw;
        width: 50%;
        margin-left: auto;
        margin-right: auto;
        text-align: center;
    }

    #countdown.page #counter {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);

        color: whitesmoke;
        font-size: 4vw;
        text-align: center;
    }

    /* IFRAME COMPATIBILITY PATCHES */
    .inside-iframe {
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .inside-iframe body {
        margin: 0;
        width: 100vw;
        height: 100vh;
    }

    .inside-iframe #countdown.page p {
        margin-top: 0;
        padding-top: 6vw;
        font-size: 6vw;
    }

    .inside-iframe #countdown.page #counter {
        top: 50%;
        font-size: 11vw;
        text-align: center;
    }
</style>

<script> // IFRAME COMPATIBILITY 
    if (window.parent !== window) { document.documentElement.classList.add('inside-iframe'); }
</script>
<div id="countdown" class="page">
    <div class="content">
        <p>Time left until I graduate: </p>
        <p id="counter"></p>
    </div>
</div>

<script>
    // ##########################################################
    // ##                Graduation Countdown                  ##
    // ##########################################################

    // Set the date we're counting down to: May 17, 2027 23:59:59
    var countDownDate = new Date("May 17, 2027 23:59:59").getTime();

    // Update the count down every 1 second
    var countdown = setInterval(function () {
        // Get today's date and time
        var now = new Date().getTime();

        // Find the distance between now and the count down date
        var distance = countDownDate - now;

        // Time calculations for days, hours, minutes and seconds
        var years = Math.floor(distance / (1000 * 60 * 60 * 24 * 365));
        var days = Math.floor(distance / (1000 * 60 * 60 * 24)) % 365;
        var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("counter").innerHTML = years + "y " + days + "d " + hours + "h "
            + minutes + "m " + seconds + "s ";

        // open the window just before the final countdown to the user can see!
        if (years <= 0 && days <= 0 && hours <= 0 && minutes <= 0 && seconds <= 10) {
            if (!wm.get_open_windows().includes('countdown')) {
                wm.open_window('countdown');
            }
            if (seconds > 0) {
                playAudio('./sfx/xp/Windows XP Information Bar.mp3', 0.8);
            } else {
                clearInterval(countdown);
                // count down is over, write some text 
                document.getElementById("counter").style.color = "green";
                document.getElementById("counter").innerHTML = "I HAVE GRADUATED!";
                // TADA.MP3
                playAudio('./sfx/xp/tada.mp3', 1);
            }
        } else {
            if (wm.get_open_windows().includes('countdown')) {
                playAudio('./sfx/xp/Windows XP Start.mp3', 0.75);
            }
        }
    }, 1000);
</script>
